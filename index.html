<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>タマチャンショップ｜資料プレビュー</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 24px;background:#faf9f6;color:#2f2b27;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}main{width:100%;max-width:390px}small{font-size:11px;letter-spacing:.16em;color:#817970}h1{font-family:serif;font-size:27px;line-height:1.55;margin:16px 0 24px;font-weight:500}p{line-height:1.85;font-size:14px;color:#6c655e}label{display:block;font-size:13px;margin:25px 0 9px}input{width:100%;padding:14px;font:inherit;border:1px solid #bbb3aa;border-radius:3px;background:#fff;color:#2f2b27}button{width:100%;margin-top:15px;padding:15px;border:0;border-radius:3px;color:#fff;background:#171513;font-size:15px;cursor:pointer}button:disabled{opacity:.55}input:focus-visible,button:focus-visible{outline:2px solid #8d857c;outline-offset:3px}#status{min-height:3em;font-size:13px}noscript{color:#8d3b2c}</style><script src="./unlock.js" defer></script></head><body><main><small>TAMACHAN SHOP</small><h1>本体Instagram<br>資料プレビュー</h1><p>共有された新しいパスワードを入力してください。<br>資料本体は暗号化して保管しています。</p><form><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required><button type="submit" disabled>資料を見る</button><p id="status" role="status" aria-live="polite">読み込んでいます…</p></form><noscript>このプレビューにはJavaScriptが必要です。</noscript></main></body></html>
